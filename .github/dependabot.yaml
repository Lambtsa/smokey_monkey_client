# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Same reason: compromised npm versions are usually caught within days
    cooldown:
      default-days: 7
    target-branch: "main"
    # ignore:
    #   - dependency-name: "*"
    #     # Security updates are unaffected by this setting.
    #     update-types: [ "version-update:semver-patch" ]
    commit-message:
      prefix: "chore(deps): "
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    commit-message:
      prefix: "ci: "
    # Keeps the SHA pins and their "# vX.Y.Z" comments up to date.
    # Wait a week after a release before proposing it: hijacked releases are
    # usually spotted and pulled within days.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
